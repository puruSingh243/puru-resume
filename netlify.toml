[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Clean personalised links like /paytm or /paytm/mridul serve the main page.
# Real files (hi.html, images, CV) are served normally because this rule is not forced.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
